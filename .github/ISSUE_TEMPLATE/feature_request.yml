name: Verbesserung vorschlagen
description: Eine konkrete Verbesserung für Website oder Projektablauf vorschlagen.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
      description: Wie könnte die Verbesserung aussehen?
    validations:
      required: true
